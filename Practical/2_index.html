
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <style>
        body {
            font-family: Arial;
            background: lightblue;
        }
        nav {
            background: navy;
            padding: 15px;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }
        form {
            background: white;
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<nav>
    <a href="#">Home</a>
    <a href="#">Register</a>
    <a href="#">Contact</a>
</nav>

<h2 style="text-align:center">Student Registration</h2>

<form>
    <label>Name:</label>
    <input type="text" required>

    <label>Email:</label>
    <input type="email" required>

    <label>Password:</label>
    <input type="password" required>

    <label>Gender:</label>
    <select>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <label>Address:</label>
    <input type="text">

    <button type="submit">Register</button>
</form>

</body>
</html>
